name: ci
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev libnetfilter-queue-dev
      - name: Build
        run: make
      - name: Unit tests
        run: make test
      - name: End-to-end test (network namespaces)
        run: sudo apt-get install -y iproute2 iptables ethtool tcpdump python3 && sudo tests/e2e.sh
